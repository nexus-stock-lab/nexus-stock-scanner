name: NEXUS Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '45 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: nexus-trade-ledger
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NEXUS scanner
        run: python scanner.py

      - name: Run NEXUS secondary review
        run: python review.py

      - name: Run NEXUS trade tracker
        run: python trade_tracker.py

      - name: Persist hypothetical trade ledger
        if: success()
        run: |
          if [ ! -f input/trades.csv ]; then
            echo "No trade ledger file; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/trades.csv
          if git diff --cached --quiet; then
            echo "Trade ledger unchanged."
          else
            git commit -m "Persist NEXUS hypothetical trade ledger"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-scan-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
