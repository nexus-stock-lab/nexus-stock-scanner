name: NEXUS Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '45 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: nexus-trade-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test paper engine
        run: python -m unittest discover -s tests -v
      - name: Diagnose price availability (never supplies fills)
        run: python quote_probe.py
      - name: Track existing paper positions independently of scanner failures
        run: python trade_tracker.py
      - name: Persist evidence and ledger on the checked-out branch
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/trades.csv input/evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist NEXUS paper ledger and evidence"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Run NEXUS scanner (existing selection rules)
        run: python scanner.py
      - name: Run NEXUS secondary review
        run: python review.py
      - name: Show phone-readable summary
        if: always()
        run: |
          if [ -f output/summary.md ]; then
            cat output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-scan-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
