
name: NEXUS Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '45 14 * * 1-5'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NEXUS scanner
        run: python scanner.py
      - name: Run NEXUS secondary review
        run: python review.py
              - name: Run NEXUS trade tracker
        run: python trade_tracker.py
      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-scan-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
