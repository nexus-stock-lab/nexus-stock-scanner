name: NEXUS Market Scan

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'prepare=広域調査 / cycle=時間別判定・照合 / track=保有追跡（finalize/reconcileは旧方式の診断）'
        type: choice
        options: [prepare, cycle, finalize, reconcile, track, gemini_probe, ir_probe, gemini_ir_probe]
        default: prepare
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '5 13-22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: nexus-trade-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXUS_EVENT_SCHEDULE: ${{ github.event.schedule }}
      PHASE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 9 * * 1-5' && 'prepare' || 'cycle') || inputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          case "$PHASE" in
            gemini_probe|gemini_ir_probe|ir_probe)
              python -m pip install "exchange_calendars>=4.5,<5" "PyYAML>=6.0,<7" ;;
            *) python -m pip install -r requirements.txt ;;
          esac
      - name: Test paper engine
        run: python -m unittest discover -s tests -v
      - name: Scan broad universe using existing rules
        if: env.PHASE == 'prepare'
        run: python scanner.py
      - name: Secondary research using existing rules
        if: env.PHASE == 'prepare'
        run: python review.py
      - name: Test Gemini on public SEC documents without ledger writes
        timeout-minutes: 10
        if: env.PHASE == 'gemini_probe' || env.PHASE == 'gemini_ir_probe'
        env:
          NEXUS_SEC_USER_AGENT: ${{ secrets.NEXUS_SEC_USER_AGENT || vars.NEXUS_SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXUS_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.NEXUS_GEMINI_FREE_TIER_CONFIRMED }}
        run: |
          if [ "$PHASE" = 'gemini_ir_probe' ]; then
            python gemini_probe.py --symbol APLD --include-ir
          else
            python gemini_probe.py
          fi
      - name: Collect official IR without AI or ledger writes
        if: env.PHASE == 'ir_probe'
        timeout-minutes: 10
        run: python issuer_ir.py
      - name: Run approved paper-validation phase
        if: env.PHASE != 'gemini_probe' && env.PHASE != 'gemini_ir_probe' && env.PHASE != 'ir_probe'
        env:
          ALPACA_DATA_KEY: ${{ secrets.ALPACA_DATA_KEY }}
          ALPACA_DATA_SECRET: ${{ secrets.ALPACA_DATA_SECRET }}
          NEXUS_SEC_USER_AGENT: ${{ secrets.NEXUS_SEC_USER_AGENT || vars.NEXUS_SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXUS_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.NEXUS_GEMINI_FREE_TIER_CONFIRMED }}
          NEXUS_GEMINI_SHADOW_ENABLED: ${{ vars.NEXUS_GEMINI_SHADOW_ENABLED }}
        run: python daily_runner.py "$PHASE"
      - name: Inventory every financial-pass source review
        if: always() && (env.PHASE == 'prepare' || env.PHASE == 'cycle')
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from review_workflow import run
          files=sorted(Path('input/research').glob('*.json'))
          if files:
              report=run(files[-1],datetime.now(ZoneInfo('Asia/Tokyo')),promote=True)
              print({key:report[key] for key in ('financial_pass_count','counts','saved_count','remote_verified_count')})
          else:
              print('No research snapshot: no approvals generated')
          PY
      - name: Persist source review reports independently of other phases
        if: always() && (env.PHASE == 'prepare' || env.PHASE == 'cycle')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths=[str(p) for p in (Path('input/review_reports'),Path('input/source_assessments'),Path('input/review_inbox')) if p.exists()]
          if paths: subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Persist source review inventory and validated review packets"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Persist Gemini request budget even on failure
        if: always() && (env.PHASE == 'gemini_probe' || env.PHASE == 'gemini_ir_probe' || vars.NEXUS_GEMINI_SHADOW_ENABLED == 'true')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          targets=[Path('input/gemini_usage.json'),Path('input/gemini_reviews'),Path('input/gemini_rejections')]
          if os.environ['PHASE'] in ('gemini_probe','gemini_ir_probe'): targets += [Path('input/official_documents'),Path('input/official_evidence'),Path('input/issuer_ir_sources')]
          paths=[str(p) for p in targets if p.exists()]
          if paths: subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Persist Gemini shadow request budget and public evidence"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Persist research, raw evidence and paper ledger on current branch
        if: success() && env.PHASE != 'gemini_probe' && env.PHASE != 'gemini_ir_probe'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/
          if ! git diff --cached --quiet; then
            git commit -m "Persist NEXUS research, market evidence and paper ledger"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Show phone-readable result
        if: always()
        run: |
          if [ -f output/summary.md ]; then
            cat output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NEXUS処理失敗。候補保存・価格照合・台帳更新の完了は確認できません。ログを確認してください。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ env.PHASE }}-results
          path: |
            output/summary.md
            output/gemini_review_status.json
            output/gemini_probe.json
            output/issuer_ir_probe.json
            output/issuer_ir_status.json
            output/trade_report.json
            output/dividend_report.json
            output/trade_log.csv
            output/daily_status.json
            output/tracking_status.json
            output/scenario_monitoring.json
            output/scenario_exit_status.json
            output/plan_status.json
            output/preparation_status.json
            output/cycle_status.json
            output/candidates.csv
            output/report.json
            output/secondary_review.csv
            output/secondary_report.json
          if-no-files-found: warn
          retention-days: 30
